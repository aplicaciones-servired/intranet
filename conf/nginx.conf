events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Permitir archivos de hasta 20MB (igual que multer)
  client_max_body_size 20M;

  # Ocultar versión de nginx
  server_tokens off;

  server {
    listen 8081;
    server_name _;

    # ── Security headers (OWASP) ──────────────────────────────────────────────
    # Evita que el navegador adivine el tipo MIME
    add_header X-Content-Type-Options "nosniff" always;
    # Evita que la página sea embebida en iframes (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Activa el filtro XSS del navegador (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # Fuerza HTTPS en futuras visitas (sin includeSubDomains hasta que clerk.* tenga cert válido)
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Limita la información enviada en el encabezado Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restringe acceso a funciones del navegador (cámara, micrófono, etc.)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ─────────────────────────────────────────────────────────────────────────

    # Resolver DNS de Docker para re-resolver hostnames dinámicamente
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    location /.well-known/ {
      alias /usr/share/nginx/html/.well-known/;
      autoindex on;
    }

    # Login API corporativa
    location /api_login/ {
      set $api_login_upstream http://api_login_v2:80;
      proxy_pass $api_login_upstream/api/v1/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # API principal — apunta DIRECTAMENTE al backend
    location ^~ /api/ {
      proxy_pass http://intranet-server-1:3000/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    location = /api {
      return 301 /api/;
    }

    # Frontend SSR (Astro)
    location / {
      proxy_pass http://web_intranet:4321;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_pass_request_headers on;
      proxy_connect_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
