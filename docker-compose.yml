version: "3.8"

services:
  # --- Backend API principal
  api_intranet:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intranet-server-1
    image: intranet-server
    networks:
      - red-gane-int
    env_file:
      - ./server/.env

  # --- Frontend Astro SSR (Node)
  web_intranet:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: web_intranet
    image: web-intranet
    expose:
      - "4321"
    depends_on:
      - api_intranet
    networks:
      - red-gane-int
    env_file:
      - ./client/.env
    # Opcional: montar el .env como volumen en desarrollo
    volumes:
      - ./client/.env:/app/.env:ro

  # --- Reverse Proxy Nginx
  proxy_intranet:
    image: nginx:alpine
    container_name: proxy_intranet
    depends_on:
      - web_intranet
      - api_intranet
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - red-gane-int
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}

networks:
  red-gane-int:
    external: true
