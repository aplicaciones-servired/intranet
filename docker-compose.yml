version: "3.8"

services:
  # --- Backend API principal
  api_intranet:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intranet-server-1
    image: intranet-server
    ports:
      - "3000:3000"
    networks:
      - red-gane-int
    env_file:
      - ./server/.env

  # --- Frontend Astro SSR (Node)
  web_intranet:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: web_intranet
    image: web-intranet
    ports:
      - "4321:4321"
    depends_on:
      - api_intranet
    networks:
      - red-gane-int
    env_file:
      - ./client/.env
    # Opcional: montar el .env como volumen en desarrollo
    volumes:
      - ./client/.env:/app/.env:ro

  # --- Backend: exponer para que NPM llegue directamente
  # (api ya usa red interna, pero exponemos para NPM)

networks:
  red-gane-int:
    external: true
