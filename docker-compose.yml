version: "3.8"

services:
  # --- Backend API principal
  api_intranet:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intranet-server-1
    image: intranet-server
    expose:
      - "3000"
    networks:
      - red-gane-int
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production

  # --- Frontend Astro SSR (Node)
  web_intranet:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: web_intranet
    image: web-intranet
    expose:
      - "4321"
    depends_on:
      - api_intranet
    networks:
      - red-gane-int
    env_file:
      - ./client/.env
    volumes:
      - ./client/.env:/app/.env:ro

  # --- Reverse Proxy Nginx (puente entre NPM y los contenedores)
  proxy_intranet:
    image: nginx:alpine
    container_name: proxy_intranet
    depends_on:
      - web_intranet
      - api_intranet
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8081"
    networks:
      - red-gane-int

networks:
  red-gane-int:
    external: true
